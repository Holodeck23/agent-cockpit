[package]
name = "cockpit-shell"
version = "0.1.4"
description = "Cockpit's native macOS shell: a system WebKit window around the loopback server"
edition = "2021"
publish = false

[lib]
name = "cockpit_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
codegen-units = 4
lto = "thin"
strip = true
